<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ascent — Daily Reading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:wght@500;600;700&family=EB+Garamond:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0e0b14; --night2:#141020; --panel:#171226;
    --ink:#e9e2d2; --ink-dim:#a89f8c;
    --gold:#d8b45a; --gold-soft:#e6cf88;
    --line:#3a3348; --feast:#c0466a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:
    radial-gradient(1200px 600px at 50% -10%, var(--night2), var(--night));
    color:var(--ink);font-family:'EB Garamond',Georgia,serif;font-size:19px;line-height:1.6}
  main{max-width:640px;margin:0 auto;padding:7vh 22px 4vh}

  .eyebrow{font-family:'IM Fell English SC',serif;font-size:.85rem;
    letter-spacing:.14em;color:var(--ink-dim);text-align:center;margin-bottom:.4rem}
  .feast-banner{display:none;text-align:center;font-family:'IM Fell English SC',serif;
    color:var(--feast);font-size:.95rem;letter-spacing:.1em;margin-bottom:1.6rem}
  .feast-banner.show{display:block}

  /* day navigation */
  .daynav{display:flex;align-items:center;justify-content:center;gap:.4rem;margin-bottom:.3rem}
  .daynav .eyebrow{margin:0}
  .daynav button{font-family:'IM Fell English SC',serif;font-size:1.05rem;color:var(--ink-dim);
    background:none;border:1px solid transparent;border-radius:6px;padding:0 .45rem;
    cursor:pointer;line-height:1.5;transition:.18s}
  .daynav button:hover:not(:disabled){color:var(--gold);border-color:var(--line)}
  .daynav button:disabled{opacity:.22;cursor:default}
  .dayjump{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:1.5rem;
    font-family:'IM Fell English SC',serif;font-size:.7rem;letter-spacing:.1em;color:var(--ink-dim)}
  .dayjump input[type=date]{font-family:inherit;font-size:.7rem;letter-spacing:.05em;color:var(--ink-dim);
    background:transparent;border:1px solid var(--line);border-radius:6px;padding:.15rem .4rem;
    color-scheme:dark;cursor:pointer}
  .dayjump input[type=date]:hover{border-color:var(--gold);color:var(--gold-soft)}
  .dayjump a{color:var(--ink-dim);text-decoration:none;border-bottom:1px solid transparent;cursor:pointer}
  .dayjump a:hover{color:var(--gold);border-bottom-color:var(--gold)}
  .dayjump a.gone{visibility:hidden}

  .nav{display:flex;justify-content:center;gap:1.6rem;margin-bottom:2rem}
  .nav a{font-family:'IM Fell English SC',serif;font-size:.85rem;
    letter-spacing:.12em;color:var(--ink-dim);text-decoration:none;
    border-bottom:1px solid transparent}
  .nav a:hover{color:var(--gold);border-bottom-color:var(--gold)}

  /* the quote */
  blockquote{margin:2.2rem 0 1.6rem;padding:0;font-size:1.5rem;line-height:1.55;
    font-weight:400;text-align:left;position:relative}
  blockquote::first-letter{font-family:'Cormorant',serif;font-weight:700;
    font-size:3.4em;float:left;line-height:.78;margin:.06em .12em 0 0;color:var(--gold)}
  .attrib{text-align:right;font-family:'Cormorant',serif;font-size:1.1rem;color:var(--gold-soft)}
  .attrib .work{font-style:italic;color:var(--ink-dim);display:block;font-size:.95rem}
  .translation{text-align:right;font-size:.78rem;color:var(--ink-dim);margin-top:.3rem}
  .verify-mark{color:var(--feast);cursor:help;border-bottom:1px dotted var(--feast)}

  /* commentary */
  .note{margin:2.4rem 0 0;padding:1.2rem 1.4rem;background:var(--panel);
    border:1px solid var(--line);border-radius:6px;font-size:1rem;color:var(--ink)}
  .note .label{font-family:'IM Fell English SC',serif;font-size:.8rem;
    letter-spacing:.12em;color:var(--ink-dim);display:block;margin-bottom:.4rem}
  .echo{margin-top:1rem;font-size:.92rem;color:var(--ink-dim);font-style:italic}
  .echo b{color:var(--gold);font-style:normal;font-weight:600;font-family:'IM Fell English SC',serif;font-size:.8rem;letter-spacing:.1em}
  .tags{margin-top:1.2rem;display:flex;flex-wrap:wrap;gap:.5rem}
  .tag{font-size:.72rem;letter-spacing:.08em;color:var(--gold-soft);
    border:1px solid var(--line);border-radius:999px;padding:.15rem .6rem}

  /* the ladder — signature element: where today sits on the ascent */
  .ladder{margin:3.2rem 0 0;border-top:1px solid var(--line);padding-top:1.4rem}
  .ladder .label{font-family:'IM Fell English SC',serif;font-size:.78rem;
    letter-spacing:.14em;color:var(--ink-dim);text-align:center;display:block;margin-bottom:.9rem}
  .rungs{display:flex;justify-content:space-between;align-items:flex-end;gap:2px}
  .rung{flex:1;text-align:center;position:relative;padding-top:14px}
  .rung::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);
    width:6px;height:6px;border-radius:50%;background:var(--line)}
  .rung.here::before{background:var(--gold);box-shadow:0 0 8px var(--gold)}
  .rung span{font-size:.6rem;letter-spacing:.05em;color:var(--ink-dim);
    writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;height:74px;overflow:hidden}
  .rung.here span{color:var(--gold-soft)}

  footer{margin-top:3rem;padding-top:1rem;border-top:1px solid var(--line);
    font-size:.75rem;color:var(--ink-dim);text-align:center}
  footer a{color:var(--ink-dim)}
  @media (max-width:520px){
    blockquote{font-size:1.28rem}
    .rung span{height:60px}
  }
  @media (prefers-reduced-motion:no-preference){
    main{animation:rise .9s ease-out}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
<main>
  <nav class="nav">
    <a href="rhizome/">The Rhizome &amp; the River</a>
  </nav>
  <div class="daynav">
    <button id="prevDay" type="button" title="The day before (left arrow)" aria-label="Previous day">&lsaquo;</button>
    <p class="eyebrow" id="dateline">…</p>
    <button id="nextDay" type="button" title="The day after (right arrow)" aria-label="Next day">&rsaquo;</button>
  </div>
  <div class="dayjump">
    <label for="dayPick">Jump to</label>
    <input type="date" id="dayPick">
    <a id="todayLink" class="gone" role="button" tabindex="0">Back to today</a>
  </div>
  <p class="feast-banner" id="feast"></p>

  <blockquote id="qtext">Loading the day's reading…</blockquote>
  <p class="attrib" id="attrib"></p>
  <p class="translation" id="trans"></p>

  <div class="note" id="notebox" hidden>
    <span class="label">Why this matters</span>
    <span id="note"></span>
    <p class="echo" id="echo"></p>
    <div class="tags" id="tags"></div>
  </div>

  <div class="ladder">
    <span class="label">The Ascent — today's rung</span>
    <div class="rungs" id="rungs"></div>
  </div>

  <footer id="foot"></footer>
</main>

<script>
/* ============================================================
   Selection logic: deterministic date-seeded walk up the
   historical arc, with liturgical feast overrides.
   No backend — every visitor sees the same quote each day.
   ============================================================ */

// Historical arc: the order of the ascent
const ARC = [
  "Philo of Alexandria",
  "Clement of Alexandria",
  "Origen of Alexandria",
  "Athanasius of Alexandria",
  "Ephrem the Syrian",
  "Gregory of Nyssa",
  "Augustine of Hippo",
  "Proclus of Constantinople",
  "Boethius",
  "Pseudo-Dionysius the Areopagite",
  "John of Damascus"
];

const ERA = {
  "Philo of Alexandria":"c. 20 BC – c. AD 50",
  "Clement of Alexandria":"c. 150 – c. 215",
  "Origen of Alexandria":"c. 185 – c. 253",
  "Athanasius of Alexandria":"c. 296 – 373",
  "Ephrem the Syrian":"c. 306 – 373",
  "Gregory of Nyssa":"c. 335 – c. 395",
  "Augustine of Hippo":"354 – 430",
  "Proclus of Constantinople":"d. 446",
  "Boethius":"c. 477 – 524",
  "Pseudo-Dionysius the Areopagite":"fl. c. 500",
  "John of Damascus":"c. 675 – 749"
};

// Fixed feasts (month is 1-based) -> preferred tag pool
const FEASTS = [
  {m:1,  d:1,  name:"Mary, Mother of God",        tags:["marian"]},
  {m:3,  d:25, name:"The Annunciation",           tags:["marian","descent-gift"]},
  {m:8,  d:15, name:"The Assumption",             tags:["marian"]},
  {m:9,  d:8,  name:"Nativity of Mary",           tags:["marian"]},
  {m:12, d:8,  name:"The Immaculate Conception",  tags:["marian"]},
  {m:12, d:25, name:"The Nativity of the Lord",   tags:["divinization","descent-gift"]},
  {m:1,  d:6,  name:"Epiphany",                   tags:["beauty-theophany","logos"]}
];

// Anonymous Gregorian computus (Easter Sunday for a given year)
function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,dd=Math.floor(b/4),e=b%4,
    f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-dd-g+15)%30,
    i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),
    mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return new Date(y,mo-1,da);
}
function inLent(dt){
  const e=easter(dt.getFullYear());
  const ash=new Date(e); ash.setDate(e.getDate()-46);
  return dt>=ash && dt<e;
}

// Simple deterministic hash for feast-day variety across years
function hash(s){let h=0;for(const ch of s){h=(h*31+ch.charCodeAt(0))>>>0}return h}

const LAUNCH = new Date(2026, 7, 24); // day 0 of the cycle — edit to your launch date
/* Count whole calendar days, not milliseconds: across a DST shift a
   midnight-to-midnight span is 23 or 25 hours, which floor() would
   round to the wrong day. */
const dayNumber = dt => Math.round(
  (Date.UTC(dt.getFullYear(), dt.getMonth(), dt.getDate()) - Date.UTC(2026, 7, 24)) / 86400000);

/* ---- day helpers ---- */
const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays  = (d,n) => { const x = midnight(d); x.setDate(x.getDate()+n); return x; };
const iso      = d => d.getFullYear() + "-" +
  String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
const fromISO  = str => { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(str || "");
  if (!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  return isNaN(d) ? null : d; };

let STATE = null;    // the corpus, loaded once
let current = null;  // the day being read

/* The reading for a given day is a pure function of the date — which is why
   any past day can be recovered without storing a thing. */
function selectFor(day, quotes, ordered){
  const n = ((dayNumber(day) % ordered.length) + ordered.length) % ordered.length;
  let pick = ordered[n];
  let feastName = null;

  // Liturgical overlay: feast override wins, Lent biases apophatic/ascent
  const feast = FEASTS.find(f => f.m === day.getMonth()+1 && f.d === day.getDate());
  const pool = feast
    ? quotes.filter(q => q.tags.some(t => feast.tags.includes(t)))
    : (inLent(day) && dayNumber(day) % 3 === 0   // every third Lenten day
        ? quotes.filter(q => q.tags.some(t => ["apophasis","ascent"].includes(t)))
        : null);
  if (pool && pool.length){
    pick = pool[hash(day.getFullYear() + (feast ? feast.name : "lent") + day.getDate()) % pool.length];
    feastName = feast ? feast.name : "Lent — the way of unknowing";
  }
  return {pick, feastName};
}

function show(day, push){
  current = midnight(day);
  const {pick, feastName} = selectFor(current, STATE.quotes, STATE.ordered);
  render(pick, current, feastName, STATE.meta);

  const today = midnight(new Date()), onToday = current.getTime() === today.getTime();
  document.getElementById("nextDay").disabled = onToday;
  document.getElementById("todayLink").classList.toggle("gone", onToday);
  const picker = document.getElementById("dayPick");
  picker.value = iso(current);
  picker.max = iso(today);

  // a day is a shareable address, and the back button walks the days
  try {
    const url = onToday ? location.pathname : location.pathname + "?d=" + iso(current);
    history[push ? "pushState" : "replaceState"]({d: iso(current)}, "", url);
  } catch(e){ /* no history API on file:// — navigation still works */ }
}

const stepDay = n => {
  const d = addDays(current, n);
  if (d <= midnight(new Date())) show(d, true);   // never read ahead of today
};

function wireDayNav(){
  document.getElementById("prevDay").onclick = () => stepDay(-1);
  document.getElementById("nextDay").onclick = () => stepDay(1);
  document.getElementById("dayPick").onchange = e => {
    const d = fromISO(e.target.value);
    if (d) show(d > midnight(new Date()) ? new Date() : d, true);
  };
  const home = () => show(new Date(), true);
  const todayLink = document.getElementById("todayLink");
  todayLink.onclick = home;
  todayLink.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); home(); } };

  window.addEventListener("popstate", e => {
    const d = fromISO(e.state && e.state.d) ||
              fromISO(new URLSearchParams(location.search).get("d")) || new Date();
    show(d, false);
  });
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if (e.key === "ArrowLeft")  { e.preventDefault(); stepDay(-1); }
    if (e.key === "ArrowRight") { e.preventDefault(); stepDay(1);  }
  });
}

async function run(){
  const res = await fetch("quotes.json");
  const data = await res.json();

  // Order the corpus by arc position, then by id for stability
  const arcPos = a => { const i = ARC.indexOf(a); return i < 0 ? ARC.length : i; };
  STATE = {
    quotes: data.quotes,
    ordered: [...data.quotes].sort((x,y) =>
      arcPos(x.author) - arcPos(y.author) || x.id.localeCompare(y.id)),
    meta: data._meta
  };

  const asked = fromISO(new URLSearchParams(location.search).get("d"));
  const today = midnight(new Date());
  show(asked && asked <= today ? asked : today, false);
  wireDayNav();
}

function render(q, day, feastName, meta){
  const fmt = new Intl.DateTimeFormat("en-US",{weekday:"long",month:"long",day:"numeric",year:"numeric"});
  document.getElementById("dateline").textContent = fmt.format(day);
  const fb = document.getElementById("feast");            // clear a stale banner when moving days
  fb.textContent = feastName ? "✦ " + feastName + " ✦" : "";
  fb.classList.toggle("show", !!feastName);

  document.getElementById("qtext").textContent = q.text;
  document.getElementById("attrib").innerHTML =
    "— " + q.author +
    " <small style='color:var(--ink-dim);font-size:.75em'>(" + (ERA[q.author] || "") + ")</small>" +
    '<span class="work">' + q.work + ", " + q.citation + "</span>";

  const needsVerify = /VERIFY|NEEDED/i.test(q.translation);
  document.getElementById("trans").innerHTML = needsVerify
    ? '<span class="verify-mark" title="Wording not yet verified against the public-domain source.">' + q.translation + "</span>"
    : q.translation;

  document.getElementById("note").textContent = q.note;
  document.getElementById("echo").innerHTML = "<b>Platonic echo</b> — " + q.platonic_echo;
  document.getElementById("tags").innerHTML =
    q.tags.map(t => '<span class="tag">' + t + "</span>").join("");
  document.getElementById("notebox").hidden = false;

  // The ladder: light the rung of today's author
  document.getElementById("rungs").innerHTML = ARC.map(a => {
    const here = a === q.author ? " here" : "";
    const last = a.split(" ").slice(-1)[0] === "Areopagite" ? "Dionysius" : a.split(" ")[0];
    return '<div class="rung' + here + '"><span>' + last + "</span></div>";
  }).join("");

  const unverified = /verify/i.test(JSON.stringify(meta)) ? " · seed content — verification in progress" : "";
  document.getElementById("foot").innerHTML =
    'Quote ' + q.id + unverified + ' · <a href="https://github.com/">source</a>';
}

run().catch(err => {
  document.getElementById("qtext").textContent =
    "Could not load quotes.json — if previewing locally, serve the folder (python3 -m http.server) rather than opening the file directly.";
  console.error(err);
});
</script>
</body>
</html>
